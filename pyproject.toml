[project]
name = "intelligent-analytics-query-engine"
version = "0.1.0"
description = "A modular natural-language analytics query engine."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<2",
    "duckdb>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "pandas>=2.1,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
